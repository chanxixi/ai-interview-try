openapi: 3.1.0

info:
  title: CareerLens · frontend → BFF
  version: 0.2.0
  description: |
    # CareerLens 契约 1/3：Vue 3 → Node BFF

    链路位置：`Vue 3 (web) → [本契约] → BFF (Koa2) → Java → Python → LLM`
    本文档是**对外契约**（浏览器可达的那一跳），也是**全项目 API 命名的唯一真源**（见 `x-api-inventory`）。

    ## 落地说明（重要）

    - part1 的 T1「契约冻结」此前未执行，`contracts/` 为空目录；本文件是**首次落地**。
      因此内容 = **part1 冻结面**（`spec.md` §2.1 / §2.2 / §2.3 / §2.8）
      **+ part2 增量**（`sdd/part2/spec.md` §2.1 C1–C4 / §2.2 / §2.3 / §2.4 / §2.5）。
    - 本文件与另两份（`bff-java.yaml` / `bff-python.yaml`）**只增不删**。
      任何路径、字段名、错误码的变更必须走 `spec.md` 的《变更记录》并同步三份契约。

    ## 相对 part1 的契约级变更（part2 spec §2.1）

    | # | 变更 | 影响本文件的点 |
    |---|---|---|
    | C1 | PDF 上传由 Out of Scope 改为 **In Scope**（DOCX 仍不做） | 新增 `POST /api/analysis/stream` 的 `multipart/form-data` 入参 |
    | C2 | 组件库 shadcn-vue → **Element Plus** | 不涉及 HTTP 契约（前端实现层） |
    | C3 | 请求链收敛为**严格线性** `Vue → BFF → Java → Python → LLM` | BFF **禁止直连 Python**；同步分析也必须经 Java |
    | C4 | 技能词典真源改为仓库内 `skills.yaml` | 不涉及 HTTP 契约（`/api/skills` 形状不变） |

    ## 相对 part1 §2.2 的响应变更（part2 spec §2.3）

    响应体由「四块」升级为「五块」，**由同步与流式两条路径共用**：

    - 新增 `recommendations`（**字段必须有**，可为空数组）
    - `match` 变为**可空**（未指定 `jobId` / `jdText` 时为 `null`）
    - `meta` 新增 `source` / `truncated` / `recommendationCount`

    > ⚠️ 这是对 part1 §2.2 冻结响应的**有意变更**，已记录在 `sdd/part2/spec.md` §2.3。
    > 因字段为**纯新增 + 放宽可空**，part1 的既有客户端不会解析失败。

    ## 错误分界线（part2 spec §2.5）

    - **建流前能判定的**（大小 / 类型）→ **同步 HTTP 状态码**（413 / 415），**不建立 SSE 流**
    - **必须读完文件才知道的**（损坏 / 加密 / 无文本层 / 页数）→ **SSE `error` 事件**（422 系列）

    ## 两条降级链不要混（part1 §2.9 + part2 §6.2）

    - **LLM 降级** → 看响应体 `meta.degraded`
    - **存储降级** → 看 Java 的 `GET /healthz.storage`（**不进入业务响应**）

servers:
  - url: http://localhost:3000
    description: BFF（Koa2 + TypeScript），开发模式
  - url: http://localhost:5173
    description: Vite dev server —— `/api` 与 `/healthz` 反向代理到 BFF（前端始终只与 BFF 对话）

tags:
  - name: health
    description: 运维探针（part1 spec §2.8 冻结）
  - name: analysis
    description: 简历分析 —— 同步与流式两个入口
  - name: jobs
    description: 岗位领域数据（只读预置，数据权归 Java 层）
  - name: skills
    description: 技能词典（只读预置，真源为仓库内 `skills.yaml`）

# ============================================================================================
# 全项目 API 命名规范（冻结）—— 施工单要求「所有请求以 /api 开头 + 遵守 RESTful」
# ============================================================================================
x-api-conventions:
  base-prefix: /api
  prefix-rule: "除运维探针 `GET /healthz` 外，**所有** HTTP 路由以 `/api` 开头（含服务间内部调用）"
  healthz-exception: |
    唯一例外：`GET /healthz`。它是 part1 `spec.md` §2.8 **稳定面**冻结的探针，
    且已被 scripts/{start-all,stop-all,demo,smoke}.sh 与 docs/RUNBOOK.md 引用；
    改路径需走 spec 变更记录，本契约不动它。
  internal-namespace: |
    服务间调用统一为 `/api/internal/*` —— `/api` 前缀保持一致，`internal` 标记
    「不经浏览器、不对公网暴露」（继承 part1 plan §3.3「内部接口统一带 /internal 前缀」的语义）。
  restful:
    - "资源用**复数名词**：`/api/jobs`、`/api/jobs/{jobId}`、`/api/skills`"
    - "动作由 HTTP 方法表达，路径里不出现动词（不造 `/api/getJobList`）"
    - "过滤/排序用 query 参数：`GET /api/jobs?category=tech-backend`（AC22）"
    - "子资源用路径嵌套：`/api/analysis/stream`"
    - "成功响应不套壳；错误统一 `{ code, message, traceId }`（指南 §6.7）"
    - "路径**不加版本号** `/api/v1`（指南 §6.6 的三个引入判据均未满足）"
  frozen-naming-caveat: |
    `POST /api/analysis` 是**单数**、`/stream` 是**动作式子资源** —— 两者都不是最纯的 REST 形态，
    但它们是 part1 spec §2.1 与 part2 spec §2.2 的**冻结路径**，改名会破坏既有客户端。
    因此**沿用**，并在本文件显式登记为「有意保留的非复数命名」。
  trace-header: X-Trace-Id
  content-types:
    request-json: application/json
    request-multipart: multipart/form-data
    response-sse: text/event-stream

# ============================================================================================
# 全项目 API 总表（四跳，提前冻结）—— 后续任务不得另起名字；新增端点先在此登记
# ============================================================================================
x-api-inventory:
  description: |
    施工单要求「根据整个项目，先提前构建好后续需要使用到的 API 接口名称」。
    本表是**四跳全部端点的一次性清单**，也是 `x-api-conventions` 的落地样例。
    另两份契约（`bff-java.yaml` / `bff-python.yaml`）只写各自那一跳的 `paths`，
    命名总表**只在此处维护一份**，避免三份漂移。

    `status` 取值：
      - `implemented` 已实现
      - `frozen`      part1 冻结、尚未实现
      - `new`         part2 新增
      - `reserved`    预留命名、本期不实现（记入 `DELIVERY.md` 扩展位）
  entries:
    - { hop: "web→bff",     method: GET,    path: "/healthz",                     status: implemented, task: "P0",       note: "运维探针；全项目唯一不以 /api 开头的路径（spec §2.8 冻结）" }
    - { hop: "web→bff",     method: GET,    path: "/api/ping",                    status: implemented, task: "P0",       note: "全链连通性探针，逐跳回显 service/runtime/traceId" }
    - { hop: "web→bff",     method: POST,   path: "/api/analysis",                status: frozen,      task: "T3",       note: "同步分析；part2 起响应体升级为 §2.3（新增 recommendations、match 可空）" }
    - { hop: "web→bff",     method: POST,   path: "/api/analysis/stream",         status: new,         task: "M6",       note: "流式分析（SSE）；Accept 不含 text/event-stream 时回退同步 JSON（AC21）" }
    - { hop: "web→bff",     method: GET,    path: "/api/jobs",                    status: frozen,      task: "T4",       note: "岗位列表；支持 ?category= 过滤（AC22）" }
    - { hop: "web→bff",     method: GET,    path: "/api/jobs/{jobId}",            status: frozen,      task: "T4",       note: "岗位详情" }
    - { hop: "web→bff",     method: GET,    path: "/api/skills",                  status: frozen,      task: "T4",       note: "技能词典" }
    - { hop: "bff→java",    method: GET,    path: "/api/jobs",                    status: frozen,      task: "T4",       note: "与 web→bff 同形状（降级对上游透明，AC9/AC10）" }
    - { hop: "bff→java",    method: GET,    path: "/api/jobs/{jobId}",            status: frozen,      task: "T4" }
    - { hop: "bff→java",    method: GET,    path: "/api/skills",                  status: frozen,      task: "T4" }
    - { hop: "bff→java",    method: POST,   path: "/api/analysis",                status: new,         task: "T3/M5",    note: "★C3 的必然推论：BFF 禁止直连 Python，同步链也必须过 Java（plan §3 未列出，本契约补上并标注）" }
    - { hop: "bff→java",    method: POST,   path: "/api/analysis/stream",         status: new,         task: "M5",       note: "multipart 字节透传 + SSE 透传" }
    - { hop: "bff→java",    method: GET,    path: "/api/internal/ping",           status: implemented, task: "P0",       note: "现状为 /internal/ping，待 M5/M6 对齐（见 x-code-delta）" }
    - { hop: "java→python", method: POST,   path: "/api/internal/analyze",        status: implemented, task: "P3",       note: "现状为 /internal/analyze，待 M2 对齐（见 x-code-delta）" }
    - { hop: "java→python", method: POST,   path: "/api/internal/analyze/stream", status: new,         task: "M4",       note: "SSE 生成端；Java 收到首事件后才开始转发（plan §1.2）" }
    - { hop: "java→python", method: GET,    path: "/api/internal/ping",           status: implemented, task: "P0",       note: "现状为 /internal/ping，待 M2 对齐" }
    - { hop: "bff→java",    method: POST,   path: "/api/admin/jobs",              status: reserved,    task: "扩展位",   note: "人工录入岗位（source=manual）；本期不实现（鉴权属 part1 Out of Scope），只冻结命名 —— part2 spec §2.9" }
    - { hop: "bff→java",    method: DELETE, path: "/api/admin/jobs/{code}",       status: reserved,    task: "扩展位",   note: "软删岗位（status=archived + deleted_at）；禁止物理 DELETE（D2）" }

