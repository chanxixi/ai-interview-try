  - framework    # 后端框架与库
  - db           # 数据库 / 存储
  - middleware   # 中间件 / 网络协议与网络库
  - frontend     # 前端框架与构建
  - devops       # 部署 / 运维 / 可观测
  - tool         # 工程工具与测试框架
  - ai           # AI / LLM 相关

