# ============================================================================
# skills.yaml —— 技能词典「真源」（part2 spec §2.1 契约变更 C4）
# ----------------------------------------------------------------------------
# 真源为什么在仓库里、而不是数据库 skill 表：
#   C4 把真源从「数据库 skill 表」改为「仓库内 YAML」，一次性去掉两个失败面 ——
#   ① HTTP 同步（谁先启动、同步失败怎么办）；② 双副本漂移（YAML 改了库没改）。
#   现在的关系是单向派生：本文件 → scripts/gen-seed.sh → db/seed.sql → skill / skill_alias
#   因此 **改本文件后必须复跑 gen-seed.sh**，否则归一化率静默下降（DoD §8）。
#
# 谁在读它：
#   ① 构建期 scripts/gen-seed.sh —— 生成 skill / skill_alias 两表，并校验岗位 JSON
#      里的 skill 全部是这里的 canonical（D3：skill_id NOT NULL 的前提）
#   ② 运行期 analyzer 的 service/normalizer.py（M3.2）—— 加载成本文件，
#      不连数据库（Python 禁止直连库，spec §2.7）
#
# 四条书写规则（plan §4.6）
#   ① canonical 写**标准名**：写 "Vue" 不写 "Vue3"；写 "C++" 不写 "C/C++"；
#      写 "TCP/IP" 不写 "TCP\P"
#   ② aliases 只放**别的写法**（连字符/空格变体、旧名、常见缩写），**不重复 canonical 自身**
#      —— canonical 由 normalizer 的「规范化后再查」这一跳命中，塞进别名表纯属冗余
#   ③ alias 必须**全局唯一**（大小写不敏感）：两个技能写同一个别名会让 gen-seed.sh
#      直接失败 —— 这是有意的，歧义别名（"Spring" 到底指 Boot 还是 Cloud）必须在源头拦掉
#   ④ category 只能取下面 categories 里的值
#
# ⚠️ 不要在这里加「软技能」（沟通能力 / 团队协作）—— 词典只收可判定的技术/工具/知识项。
# ⚠️ aliases 可以为空列表：说明这个技能没有广泛认可的第二种写法，不是漏写。
# ============================================================================

version: 1
updated_at: "2026-10-14"

# category 的闭集（plan §4.4）。gen-seed.sh 用它校验每条的 category，避免手滑写错。
categories:
